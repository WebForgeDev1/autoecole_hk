<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Demande envoyée | Hk Conduite Le Mans</title>
  <link rel="icon" href="assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="assets/css/styles.min.css?v=20261111-form-success">
  <style>
    html, body { min-height: 100%; background: #f4f7f5; }
    .success-page { box-sizing: border-box; min-height: calc(100svh - var(--header-h, 76px)); display: grid; place-items: center; padding: clamp(3rem, 7vw, 6rem) 1.25rem; background: #f4f7f5; }
    .success-panel { width: min(100%, 44rem); padding: clamp(2rem, 6vw, 4.5rem); border: 1px solid #dce6df; border-radius: 24px; background: #fff; text-align: center; box-shadow: 0 18px 45px rgba(17, 33, 61, 0.08); }
    .success-mark { width: 4.5rem; height: 4.5rem; display: grid; place-items: center; margin: 0 auto 1.6rem; border-radius: 50%; background: #e7f8ed; color: #159447; }
    .success-mark svg { width: 2.35rem; height: 2.35rem; fill: none; stroke: currentColor; stroke-width: 1.8; }
    .success-panel h1 { max-width: 32rem; margin: 0 auto; color: #17223b; font-size: clamp(2rem, 5vw, 3.5rem); line-height: 1.08; letter-spacing: -0.04em; }
    .success-panel p { max-width: 34rem; margin: 1.15rem auto 0; color: #647086; font-size: clamp(1rem, 2vw, 1.15rem); line-height: 1.65; }
    .success-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.75rem; margin-top: 2rem; }
    .success-actions .btn { min-height: 3rem; }
    .success-help { margin-top: 2.1rem !important; padding-top: 1.5rem; border-top: 1px solid #e1e8e3; font-size: 0.9rem !important; }
    .success-help a { color: #168d42; font-weight: 700; }
    @media (max-width: 640px) { .success-page { min-height: calc(100svh - var(--header-h, 70px)); padding-top: 2rem; padding-bottom: 2rem; } .success-panel { border-radius: 18px; } .success-actions { flex-direction: column; } .success-actions .btn { width: 100%; } }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Aller au contenu</a>
  <header class="site-header inner-header is-scrolled">
    <a class="brand" href="index.html" aria-label="Accueil Hk Conduite Le Mans">
      <picture><source srcset="assets/img/hk-logo-42.webp" type="image/webp"><img class="brand-logo" src="assets/img/hk-logo-42.png" alt="HK Conduite" width="42" height="42"></picture>
      <span><strong>Hk Conduite</strong><small>Le Mans</small></span>
    </a>
    <a class="header-cta" href="contact.html">Nous contacter</a>
  </header>
  <main class="success-page" id="main">
    <section class="success-panel" aria-labelledby="success-title">
      <div class="success-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="m8 12.2 2.6 2.7L16.4 9"></path></svg></div>
      <h1 id="success-title">Votre demande a bien été envoyée.</h1>
      <p id="success-message">Merci de nous avoir contactés. L’équipe Hk Conduite vous répond dès que possible.</p>
      <div class="success-actions">
        <a class="btn primary" href="formations.html">Voir les formations</a>
        <a class="btn secondary" href="index.html">Retour à l’accueil</a>
      </div>
      <p class="success-help">Besoin d’une réponse immédiate ? <a href="tel:+33789530417">Appelez-nous au 07 89 53 04 17</a>.</p>
    </section>
  </main>
  <script>
    const firstName = new URLSearchParams(window.location.search).get("prenom");
    if (firstName) document.getElementById("success-message").textContent = `Merci ${firstName}, votre demande a bien été envoyée. L’équipe Hk Conduite vous répond dès que possible.`;
  </script>
</body>
</html>
